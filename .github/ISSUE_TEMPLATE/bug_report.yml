name: Bug report
description: Something in TypeSafeSharp does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your API key or real request text.** Replace them with made-up values.
        Security problems go through [a private advisory](https://github.com/sanamhub/typesafe-dotnet/security/advisories/new), not here.
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      description: The smallest snippet that shows the problem, with made-up state and questions.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected, what happened, and the full exception if there was one.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: The exception's RequestId, or the x-typesafe-request-id response header, if you have one.
  - type: input
    id: version
    attributes:
      label: TypeSafeSharp version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Target framework and OS
      placeholder: net10.0 on Linux x64, net481 on Windows 11, ...
    validations:
      required: true
